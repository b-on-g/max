<!doctype html>
<html lang="ru" mol_view_root>
	<head>
		<meta charset="utf-8" />
		<meta lang="ru" />
		<meta name="viewport" content="width=device-width, height=device-height, initial-scale=1" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<link href="bog/max/assets/logo.svg" rel="icon" />
		<meta name="description" content="Заявки в управляющую компанию через MAX" />
		<meta property="og:title" content="Заявки в УК" />
		<meta property="og:type" content="website" />
		<meta property="og:description" content="Заявки в управляющую компанию через MAX" />
		<meta property="og:site_name" content="Заявки в УК" />
		<meta property="og:url" content="https://b-on-g.github.io/max/" />
		<link rel="manifest" href="manifest.json" />
		<script async src="https://st.max.ru/js/max-web-app.js"></script>
		<script>
			if( navigator.serviceWorker ) {
				navigator.serviceWorker.register = ()=> new Promise( ()=> {} )
				navigator.serviceWorker.getRegistrations().then( list => {
					if( !list.length ) return
					return Promise.all( list.map( reg => reg.unregister() ) ).then( ()=> {
						if( !navigator.serviceWorker.controller ) return
						try { if( sessionStorage.getItem( 'bog_max_sw_off' ) ) return; sessionStorage.setItem( 'bog_max_sw_off', '1' ) } catch {}
						location.reload()
					} )
				} ).catch( ()=> {} )
			}
			if( self.caches ) caches.delete( '$mol_offline' ).catch( ()=> {} )
		</script>
	</head>
	<body mol_view_root>
		<div mol_view_root="$bog_max_app"></div>
		<script src="web.js"></script>
	
				<script src="/mol/build/client/client.js" charset="utf-8"></script>
				<script src="web.test.js" charset="utf-8"></script>
				<script>
					addEventListener( 'load', ()=> setTimeout( ()=> {
						const audit =  document.createElement( 'script' )
						audit.src = 'web.audit.js'
						document.head.appendChild( audit )
					}, 500 ) )
				</script>
				</body>
</html>
